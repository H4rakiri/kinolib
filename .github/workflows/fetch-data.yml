name: Обновление каталога

# Раз в неделю (понедельник, 04:00 UTC) собираем свежий каталог и коммитим его.
# Коммит в main автоматически запускает deploy.yml → сайт обновляется.
# Можно запустить вручную через вкладку Actions (workflow_dispatch).
on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Собрать каталог
        env:
          KP_TOKEN: ${{ secrets.KP_TOKEN }}
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: node scripts/fetch-data.mjs
      - name: Закоммитить изменения
        run: |
          git config user.name "kinolib-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/data/catalog.json
          if git diff --staged --quiet; then
            echo "Каталог не изменился."
          else
            git commit -m "Обновление каталога $(date -u +%Y-%m-%d)"
            git push
          fi
